# ============================================================
# music-platform · Phase 4：零死锁 GitHub Actions 云端出包流水线
# 触发：Actions 页手动 dispatch（可选 export method / 蒲公英上传）
#
# 需要的 Secrets（仓库 Settings → Secrets and variables → Actions）：
#   P12_BASE64            .p12 证书的 base64（见下方传统格式转换）
#   P12_PASSWORD          .p12 证书密码
#   MOBILEPROVISION_BASE64 .mobileprovision 描述文件的 base64
#   PGYER_API_KEY         蒲公英 API Key（仅 upload_pgyer=true 时需要）
#
# p12 传统格式转换（macOS 的 security import 只认 3DES/SHA1 老格式，
# 若你的 p12 是新格式，先在本地执行）：
#   openssl pkcs12 -in new.p12 -out /tmp/tmp.pem -nodes -passin pass:你的密码
#   openssl pkcs12 -export -in /tmp/tmp.pem -out /tmp/legacy.p12 \
#       -passout pass:你的密码 -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -nomac
#   base64 -i /tmp/legacy.p12 | pbcopy   # 粘贴为 P12_BASE64
#   base64 -i Your.mobileprovision | pbcopy  # 粘贴为 MOBILEPROVISION_BASE64
#
# 前置要求：app/ios/MusicApp/Info.plist 的 CFBundleIdentifier
# 必须已改为与 .mobileprovision 的 App ID 完全一致（禁止占位符）。
# ============================================================

name: Build IPA (iOS)

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "导出方式"
        required: true
        default: "ad-hoc"
        type: choice
        options: [ad-hoc, app-store, development]
      upload_pgyer:
        description: "上传到蒲公英并生成扫码安装链接"
        required: false
        default: false
        type: boolean

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_DIR: app
  IOS_DIR: app/ios
  WORKSPACE: app/ios/MusicApp.xcworkspace
  SCHEME: MusicApp
  CONFIGURATION: Release

jobs:
  build:
    name: Archive & Export IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      # ---------- 1. 检出 ----------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 2. Node 18 + 依赖 ----------
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install JS dependencies
        working-directory: ${{ env.APP_DIR }}
        # 注：仓库未提交 package-lock.json（体积超推送通道限制），用 npm install 代替 npm ci
        run: npm install

      # ---------- 3. 确保 Xcode 子脚本能找到 node（防 xcodebuild 内脚本失联） ----------
      - name: Symlink node for Xcode build scripts
        run: |
          sudo ln -sf "$(which node)" /usr/local/bin/node
          node --version
          xcodebuild -version

      # ---------- 3.5 选择 Xcode 16 工具链 ----------
      # 部分 Pod 预编译模块（如 async-storage 的 SharedAsyncStorage）用 Swift 6 构建，
      # runner 默认的 Xcode 15（Swift 5.10）编译器不认，必须切到 Xcode 16+
      - name: Select Xcode 16 toolchain
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          [[ -n "$XCODE_APP" ]] || { echo "::error::未找到 Xcode 16，现有版本:"; ls -d /Applications/Xcode*.app 2>/dev/null; exit 1; }
          echo "使用 $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      # ---------- 4. Bundle ID 前置校验（占位符直接失败，不浪费 20 分钟构建） ----------
      - name: Verify bundle identifier is not placeholder
        run: |
          # Info.plist 里是 $(PRODUCT_BUNDLE_IDENTIFIER) 变量，真值从 pbxproj 取
          BUNDLE_ID=$(grep -m1 'PRODUCT_BUNDLE_IDENTIFIER' "${{ env.IOS_DIR }}/MusicApp.xcodeproj/project.pbxproj" | sed -E 's/.*=[[:space:]]*([^;]+);/\1/' | xargs)
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          if [[ "$BUNDLE_ID" == "com.example.musicapp" ]]; then
            echo "::error::仍是占位 bundle id，请先改为与描述文件一致的真实 App ID"
            exit 1
          fi
          echo "Bundle ID: $BUNDLE_ID"

      # ---------- 5. CocoaPods ----------
      - name: Pod install
        working-directory: ${{ env.IOS_DIR }}
        run: pod install

      # ---------- 6. 钥匙串与证书注入（防卡死核心） ----------
      - name: Create and unlock temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # 允许不设 KEYCHAIN_PASSWORD：未提供则随机生成
          if [[ -z "$KEYCHAIN_PASSWORD" ]]; then
            KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
            echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          fi
          KEYCHAIN_PATH="$HOME/Library/Keychains/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Import .p12 signing certificate
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ env.KEYCHAIN_PASSWORD }}
        run: |
          [[ -n "$P12_BASE64" ]] || { echo "::error::缺少 Secret P12_BASE64"; exit 1; }
          echo "$P12_BASE64" | base64 --decode -o /tmp/cert.p12
          security import /tmp/cert.p12 \
            -k "$HOME/Library/Keychains/build.keychain-db" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          shred -u /tmp/cert.p12 2>/dev/null || rm -f /tmp/cert.p12
          # ★ 防死锁核心：p12 导入后才允许 codesign / apple 工具无头访问私钥，
          # 杜绝签名时弹窗卡死（空钥匙串上执行会报 SecItemCopyMatching 失败）
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$HOME/Library/Keychains/build.keychain-db"
          # 取 codesigning 身份名供 xcodebuild 使用
          IDENTITY=$(security find-identity -v -p codesigning "$HOME/Library/Keychains/build.keychain-db" \
            | grep -o '"[^"]*"' | head -1 | tr -d '"')
          [[ -n "$IDENTITY" ]] || { echo "::error::钥匙串中未找到 codesigning 身份，检查 p12 是否为传统格式"; exit 1; }
          echo "CODE_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing identity: $IDENTITY"

      # ---------- 7. 安装描述文件 ----------
      - name: Install provisioning profile
        env:
          MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          [[ -n "$MOBILEPROVISION_BASE64" ]] || { echo "::error::缺少 Secret MOBILEPROVISION_BASE64"; exit 1; }
          DEST="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DEST"
          TMP_PROV=/tmp/profile.mobileprovision
          echo "$MOBILEPROVISION_BASE64" | base64 --decode -o "$TMP_PROV"
          [[ -s "$TMP_PROV" ]] || { echo "::error::描述文件 base64 解码后为空，检查 MOBILEPROVISION_BASE64 secret"; exit 1; }
          # PlistBuddy 不能读管道，必须先落地成文件再解析
          TMP_PLIST=/tmp/profile.plist
          security cms -D -i "$TMP_PROV" -o "$TMP_PLIST" || { echo "::error::描述文件不是有效的 CMS/PKCS#7，检查 secret 内容"; exit 1; }
          PROV_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$TMP_PLIST")
          PROV_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$TMP_PLIST")
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$TMP_PLIST")
          cp "$TMP_PROV" "$DEST/$PROV_UUID.mobileprovision"
          rm -f "$TMP_PROV" "$TMP_PLIST"
          echo "PROVISION_NAME=$PROV_NAME" >> "$GITHUB_ENV"
          echo "Provision: $PROV_NAME ($PROV_UUID), App ID: $APP_ID"
          # ★ 校验 bundle id 与描述文件一致性
          if [[ "$APP_ID" != *".$BUNDLE_ID" && "$APP_ID" != "$BUNDLE_ID" ]]; then
            echo "::error::描述文件 App ID($APP_ID) 与工程 bundle id($BUNDLE_ID) 不一致"
            exit 1
          fi

      # ---------- 8. 生成 ExportOptions.plist ----------
      - name: Generate ExportOptions.plist
        run: |
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${{ inputs.export_method }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ env.BUNDLE_ID }}</key><string>${{ env.PROVISION_NAME }}</string>
            </dict>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadBitcode</key><false/>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          EOF
          plutil -lint /tmp/ExportOptions.plist && echo "ExportOptions.plist OK"

      # ---------- 9. Archive ----------
      - name: Xcode archive
        run: |
          xcodebuild \
            -workspace "${{ env.WORKSPACE }}" \
            -scheme "${{ env.SCHEME }}" \
            -configuration "${{ env.CONFIGURATION }}" \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MusicApp.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${{ env.CODE_SIGN_IDENTITY }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ env.PROVISION_NAME }}" \
            archive

      # ---------- 10. Export IPA ----------
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MusicApp.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist /tmp/ExportOptions.plist
          IPA_PATH=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)
          [[ -n "$IPA_PATH" ]] || { echo "::error::未找到导出的 .ipa"; exit 1; }
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          ls -lh "$IPA_PATH"

      # ---------- 11. 上传 Artifacts ----------
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicApp-${{ inputs.export_method }}-${{ github.run_number }}
          path: ${{ env.IPA_PATH }}
          retention-days: 30

      # ---------- 12. 可选：蒲公英无线分发 ----------
      - name: Upload to Pgyer
        if: inputs.upload_pgyer == true
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
        run: |
          [[ -n "$PGYER_API_KEY" ]] || { echo "::error::upload_pgyer=true 但缺少 Secret PGYER_API_KEY"; exit 1; }
          RESP=$(curl -s -F "file=@${{ env.IPA_PATH }}" \
            -F "_api_key=$PGYER_API_KEY" \
            -F "buildInstallType=1" \
            https://www.pgyer.com/apiv2/app/upload)
          echo "$RESP"
          QR_URL=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('buildQRCodeURL',''))" 2>/dev/null || true)
          if [[ -n "$QR_URL" ]]; then
            echo "## 蒲公英安装链接" >> "$GITHUB_STEP_SUMMARY"
            echo "$QR_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::蒲公英上传返回异常，请检查 API Key"
          fi

      # ---------- 13. 清理钥匙串（防证书残留） ----------
      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build.keychain || true
