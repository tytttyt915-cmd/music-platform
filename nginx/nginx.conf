# ============================================================
# music-platform Phase 1: 生产环境 Nginx（流媒体网关）
# 强制暴露 Range/206 关键头：Content-Range, Accept-Ranges, Content-Length, ETag
# ============================================================
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # 音频大文件：关闭代理缓冲，边下边吐；强制保留 Range 语义
    proxy_buffering     off;
    proxy_force_ranges  on;
    proxy_http_version  1.1;

    # Docker 嵌入式 DNS：运行时动态解析 backend（避免启动时硬解析失败导致 emerg 退出）
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # 后端地址用变量，nginx 在每次请求时才解析 DNS
        set $backend_upstream backend:3000;

        # ---------- 流媒体网关：/audio/* ----------
        location /audio/ {
            proxy_pass http://$backend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # 透传客户端 Range / If-Range，保证 206 断点续传
            proxy_set_header Range    $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_force_ranges on;

            # 强制暴露给播放器 / WebAudio 的关键头（含 206 响应）
            add_header Accept-Ranges bytes always;
            add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length, ETag" always;

            # 音频不走 gzip
            gzip off;
        }

        # ---------- 业务 API ----------
        location / {
            proxy_pass http://$backend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout  60s;
            proxy_send_timeout  60s;
        }

        # ---------- 健康检查 ----------
        location = /nginx-health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}
